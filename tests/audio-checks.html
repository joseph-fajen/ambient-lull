<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio checks</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 50rem; }
    .pass { color: #17803d; } .fail { color: #c62828; font-weight: bold; }
    li { margin: 0.2rem 0; }
  </style>
</head>
<body>
  <h1>Audio checks</h1>
  <p>Renders sound offline (to numbers, not the speakers) and measures it.</p>
  <p id="status">Running…</p>
  <ul id="results"></ul>
  <script type="module">
    import { playNote, playWithHarmony, createBus, startDrone, DRONE_FADE, WIDTH_MAX } from '../src/audio.js';
    import { DEFAULT_SETTINGS } from '../src/settings.js';
    import { nextNote, beatInterval, createRandom, dronePitch, createComposer, noteLength, NOTE_LENGTHS, TEMPO_MAX, DRIFT_PERIOD } from '../src/music.js';
    import { SOUNDS } from '../src/settings.js';
    import { LOOKAHEAD } from '../src/scheduler.js';
    import { SAMPLE_SETS, loadSampleSet } from '../src/samples.js';

    await Promise.all(Object.keys(SAMPLE_SETS).map(name => loadSampleSet(name, '../')));

    const RATE = 44100;
    const results = [];

    function report(ok, name, detail) {
      results.push(ok);
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name} — ${detail}`;
      document.getElementById('results').append(li);
    }

    async function render(seconds, build) {
      const ctx = new OfflineAudioContext(2, Math.ceil(seconds * RATE), RATE);
      build(ctx);
      return ctx.startRendering();
    }

    // Loudest absolute sample between two times (seconds), across channels.
    function peak(buffer, from = 0, to = buffer.duration) {
      let max = 0;
      const a = Math.max(0, Math.floor(from * RATE));
      const b = Math.min(buffer.length, Math.ceil(to * RATE));
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = a; i < b; i++) max = Math.max(max, Math.abs(data[i]));
      }
      return max;
    }

    // Average loudness (root mean square) between two times, across channels.
    function rms(buffer, from, to) {
      let sum = 0, n = 0;
      const a = Math.floor(from * RATE), b = Math.ceil(to * RATE);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = a; i < b; i++) { sum += data[i] * data[i]; n++; }
      }
      return Math.sqrt(sum / n);
    }

    const dB = x => (x > 0 ? (20 * Math.log10(x)).toFixed(1) : '-inf') + ' dB';

    // 1. No clicks: a single dry note starts and ends at near-zero volume.
    // Shortest note length (sharpest fades), brightest tone, lowest/middle/highest pitch,
    // placed left, centre and right at full width.
    async function checkClicks() {
      const shortest = noteLength(TEMPO_MAX) * Math.min(...NOTE_LENGTHS.map(l => l.ring));
      const start = 0.1, duration = shortest, end = start + duration;
      let worstStart = 0, worstEnd = 0, worstAfter = 0;
      for (const w of SOUNDS) {
        for (const [midi, pan] of [[42, -1], [60, 0], [77, 1]]) {
          const buf = await render(end + 0.3, ctx =>
            playNote(ctx, ctx.destination, start, { midi, duration, pan }, { sound: w.id, tone: 1, width: 1 }));
          const notePeak = peak(buf);
          worstStart = Math.max(worstStart, peak(buf, start, start + 0.005) / notePeak);
          worstEnd = Math.max(worstEnd, peak(buf, end - 0.02, end) / notePeak);
          worstAfter = Math.max(worstAfter, peak(buf, end + 0.001));
        }
      }
      report(worstStart < 0.03, 'No click at note start',
        `first 5 ms reaches ${(worstStart * 100).toFixed(2)}% of the note's peak (limit 3%)`);
      report(worstEnd < 0.001, 'No click at note end',
        `last 20 ms reaches ${(worstEnd * 100).toFixed(3)}% of the note's peak (limit 0.1%)`);
      report(worstAfter < 1e-6, 'Silent after the note ends', `peak after end ${worstAfter.toExponential(1)}`);
    }

    // Melody plus harmony notes from the composer until `until`, each note's length
    // (in beats) setting the gap to the next, as in the app. Start is at time 0 (for drift).
    function playMelody(ctx, destination, settings, seed, until) {
      const composer = createComposer(settings, createRandom(seed));
      for (let t = 0.05; t < until;) {
        const note = composer.next(t);
        playWithHarmony(ctx, destination, t, note, settings);
        t += note.beats * beatInterval(settings.tempo);
      }
    }

    // 2. No distortion: a dense melody through the full bus (dry + reverb) never reaches 1.0.
    // Worst case: drone and harmony at full, full width, brightest tone. Steady rhythm at 120 BPM is the
    // loudest (measured), so it gets the most seeds; peaks vary a lot from seed to seed.
    async function checkPeak() {
      const runs = [];
      for (const w of SOUNDS) {
        for (const key of ['F#', 'F']) { // lowest and highest pitch ranges
          for (let seed = 1; seed <= 6; seed++) runs.push({ w, key, seed, tempo: 120, variety: 0 });
          runs.push({ w, key, seed: 1, tempo: 20, variety: 0 });
          runs.push({ w, key, seed: 1, tempo: 120, variety: 1 });
          runs.push({ w, key, seed: 2, tempo: 120, variety: 1 });
        }
      }
      let worst = { level: 0 };
      // Several renders at once: the browser runs each offline render on its own thread.
      const runOne = async ({ w, key, seed, tempo, variety }) => {
        const settings = { key, scale: 'major-pentatonic', sound: w.id, tone: 1, tempo, harmony: 1, variety, width: 1 };
        const playFor = 20;
        const buf = await render(playFor + 12, ctx => {
          const bus = createBus(ctx);
          startDrone(ctx, bus.dryInput, 0.05, dronePitch(key), 1); // loudest drone
          playMelody(ctx, bus.input, settings, seed, playFor);
        });
        const level = peak(buf);
        if (level > worst.level) worst = { level, label: `${w.name} (${w.detail}), ${tempo} BPM, key ${key}, rhythm ${variety}, seed ${seed}` };
      };
      const batch = Math.max(1, navigator.hardwareConcurrency || 1);
      for (let i = 0; i < runs.length; i += batch) await Promise.all(runs.slice(i, i + batch).map(runOne));
      report(worst.level < 0.9, 'Peak stays well below 1.0',
        `loudest of ${runs.length} runs: ${worst.level.toFixed(3)} (${dB(worst.level)}) — ${worst.label}, brightest tone, ` +
        `drone and harmony at full, full width (limit 0.9, leaving room for unluckier runs)`);
    }

    // 2b. Harmony supports the melody rather than piling on: turning it up adds little
    // loudness. Default sound, average of a few seeds, harmony off vs default vs full.
    async function checkHarmonyLoudness() {
      const levelAt = async harmony => {
        let sum = 0;
        for (const seed of [1, 2]) {
          const settings = { ...DEFAULT_SETTINGS, harmony };
          const buf = await render(60, ctx => playMelody(ctx, createBus(ctx).input, settings, seed, 60));
          sum += 20 * Math.log10(rms(buf, 8, 58));
        }
        return sum / 2;
      };
      const none = await levelAt(0);
      const atDefault = (await levelAt(DEFAULT_SETTINGS.harmony)) - none;
      const atFull = (await levelAt(1)) - none;
      report(atDefault <= 1 && atFull <= 1.5, 'Harmony adds little loudness',
        `vs no harmony: +${atDefault.toFixed(2)} dB at default, +${atFull.toFixed(2)} dB at full (limits 1 dB, 1.5 dB)`);
    }

    // 2c. Rhythm: varied lengths mean fewer notes on average, so it's a little quieter.
    // Check it stays close to steady, at slow, default and fast tempos.
    async function checkRhythmLoudness() {
      const lines = [];
      let worst = 0;
      for (const tempo of [20, 40, 120]) {
        const levelAt = async variety => {
          let sum = 0;
          for (const seed of [1, 2]) {
            const settings = { ...DEFAULT_SETTINGS, tempo, variety };
            const buf = await render(90, ctx => playMelody(ctx, createBus(ctx).input, settings, seed, 90));
            sum += 20 * Math.log10(rms(buf, 10, 88));
          }
          return sum / 2;
        };
        const steady = await levelAt(0);
        const diffs = [DEFAULT_SETTINGS.variety, 1].map(async v => (await levelAt(v)) - steady);
        const [atDefault, atFull] = await Promise.all(diffs);
        worst = Math.max(worst, Math.abs(atDefault), Math.abs(atFull));
        lines.push(`${tempo} BPM: ${atDefault.toFixed(1)} dB at default, ${atFull.toFixed(1)} dB at full`);
      }
      report(worst <= 3, 'Varied rhythm stays close to steady in loudness',
        `vs steady — ${lines.join('; ')} (limit 3 dB)`);
    }

    // 2e. Drift: over one full rise and fall, harmony comes and goes but never adds more
    // than the harmony limits allow. Each 30 s window is compared with the same seed and
    // no harmony (harmony has its own random numbers, so the melody is the same).
    async function checkDrift() {
      const seconds = DRIFT_PERIOD + 10, windows = [];
      for (let from = 5; from + 30 <= DRIFT_PERIOD + 5; from += 30) windows.push(from);
      const lines = [];
      let worst = 0;
      for (const harmony of [DEFAULT_SETTINGS.harmony, 1]) {
        const diffs = windows.map(() => 0);
        for (const seed of [1, 2]) {
          const withDrift = await render(seconds, ctx =>
            playMelody(ctx, createBus(ctx).input, { ...DEFAULT_SETTINGS, harmony, drift: true }, seed, seconds));
          const none = await render(seconds, ctx =>
            playMelody(ctx, createBus(ctx).input, { ...DEFAULT_SETTINGS, harmony: 0 }, seed, seconds));
          windows.forEach((from, i) => {
            diffs[i] += (20 * Math.log10(rms(withDrift, from, from + 30) / rms(none, from, from + 30))) / 2;
          });
        }
        worst = Math.max(worst, ...diffs);
        lines.push(`harmony ${harmony}: ${diffs.map(d => (d >= 0 ? '+' : '') + d.toFixed(1)).join(' ')} dB`);
      }
      report(worst <= 1.5, 'Drift: harmony comes and goes without getting too loud',
        `vs no harmony, each 30 s of a ${DRIFT_PERIOD} s cycle — ${lines.join('; ')} (limit +1.5 dB, as for harmony at full)`);
    }

    // 2d. Stereo: Mono puts a note in the middle; at full width a note at the edge leans
    // well to one side, without getting louder or quieter overall.
    async function checkStereo() {
      const level = (buf, ch, from, to) => rms({ numberOfChannels: 1, getChannelData: () => buf.getChannelData(ch) }, from, to);
      const note = async (pan, width) => {
        const buf = await render(3, ctx =>
          playNote(ctx, ctx.destination, 0.05, { midi: 60, duration: 2.5, pan }, { ...DEFAULT_SETTINGS, width }));
        const l = level(buf, 0, 0.1, 2.5), r = level(buf, 1, 0.1, 2.5);
        return { l, r, total: Math.hypot(l, r) };
      };
      const mono = await note(1, 0);
      const centre = await note(0, 1);
      const right = await note(1, 1);
      const left = await note(-1, 1);
      const monoGap = Math.abs(20 * Math.log10(mono.l / mono.r));
      const lean = 20 * Math.log10(right.r / right.l);
      const leanLeft = 20 * Math.log10(left.l / left.r);
      const totalDiff = Math.max(...[right, left].map(n => Math.abs(20 * Math.log10(n.total / centre.total))));
      report(monoGap < 0.01 && lean > 10 && Math.abs(lean - leanLeft) < 0.01 && totalDiff < 0.1,
        'Stereo places notes left to right without changing their loudness',
        `Mono: left and right differ by ${monoGap.toFixed(3)} dB; full width, edge note (pan ${WIDTH_MAX}): ` +
        `${lean.toFixed(1)} dB towards its side (right) and ${leanLeft.toFixed(1)} dB (left); ` +
        `overall level vs centred ${totalDiff.toFixed(3)} dB (needs 0 dB at Mono, over 10 dB lean, under 0.1 dB change)`);

      // The whole mix: default settings at Mono, default and full width.
      const levelAt = async width => {
        let sum = 0;
        for (const seed of [1, 2]) {
          const settings = { ...DEFAULT_SETTINGS, width };
          const buf = await render(60, ctx => playMelody(ctx, createBus(ctx).input, settings, seed, 60));
          sum += 20 * Math.log10(rms(buf, 8, 58));
        }
        return sum / 2;
      };
      const monoMix = await levelAt(0);
      const atDefault = (await levelAt(DEFAULT_SETTINGS.width)) - monoMix;
      const atFull = (await levelAt(1)) - monoMix;
      report(Math.abs(atDefault) <= 0.5 && Math.abs(atFull) <= 0.5, 'Width keeps the music at the same loudness',
        `vs Mono: ${atDefault.toFixed(2)} dB at default, ${atFull.toFixed(2)} dB at full (limit ±0.5 dB)`);
    }

    // 3. Stop is clean: after the fade, the output (notes and reverb tail) is silent.
    // Notes are booked up to LOOKAHEAD past Stop, as the real timer loop would.
    async function checkStop() {
      const stopAt = 6;
      const settings = { key: 'C', scale: 'major-pentatonic', sound: 'piano', tone: 1, tempo: 60, harmony: 1, variety: 1 };
      let fadeEnd;
      const buf = await render(stopAt + 12, ctx => {
        const bus = createBus(ctx);
        playMelody(ctx, bus.input, settings, 3, stopAt + LOOKAHEAD);
        startDrone(ctx, bus.dryInput, 0.05, dronePitch(settings.key), 1).release(stopAt);
        fadeEnd = bus.fadeOut(stopAt);
      });
      const playing = peak(buf, 0, stopAt);
      const after = peak(buf, fadeEnd + 0.001);
      report(playing > 0.05 && after < 1e-6, 'Silent after Stop fades out',
        `playing peak ${playing.toFixed(3)}, after the ${(fadeEnd - stopAt).toFixed(1)} s fade ${after.toExponential(1)}`);
    }

    // 4. Drone: no click when it starts, silent after release, quieter than the melody.
    async function checkDrone() {
      const start = 0.1, releaseAt = 4;
      let worstStart = 0, worstAfter = 0;
      for (const midi of [dronePitch('F#'), dronePitch('F')]) { // lowest and highest drone
        const buf = await render(releaseAt + DRONE_FADE + 0.5, ctx =>
          startDrone(ctx, ctx.destination, start, midi, 1).release(releaseAt));
        worstStart = Math.max(worstStart, peak(buf, start, start + 0.005) / peak(buf));
        worstAfter = Math.max(worstAfter, peak(buf, releaseAt + DRONE_FADE + 0.06));
      }
      report(worstStart < 0.03, 'No click when the drone starts',
        `first 5 ms reaches ${(worstStart * 100).toFixed(2)}% of its peak (limit 3%)`);
      report(worstAfter < 1e-6, 'Silent after the drone is released', `peak after ${worstAfter.toExponential(1)}`);

      // Default settings (with their harmony and rhythm), melody alone vs drone alone,
      // through the bus. A longer stretch, since varied rhythm makes the level uneven.
      const melody = await render(60, ctx => playMelody(ctx, createBus(ctx).input, DEFAULT_SETTINGS, 5, 60));
      const melodyLevel = rms(melody, 8, 58);
      const gapsAt = async volume => {
        const gaps = [];
        for (const key of ['F#', 'C', 'F']) { // lowest, default and highest drone
          const droneOnly = await render(30, ctx => startDrone(ctx, createBus(ctx).dryInput, 0.05, dronePitch(key), volume));
          gaps.push(20 * Math.log10(melodyLevel / rms(droneOnly, 8, 28)));
        }
        return gaps;
      };
      const gaps = await gapsAt(DEFAULT_SETTINGS.droneVolume);
      const spread = Math.max(...gaps) - Math.min(...gaps);
      report(Math.min(...gaps) >= 3 && spread <= 3, 'Drone sits under the melody at default volume, evenly across keys',
        `drone is ${gaps.map(g => g.toFixed(1)).join(' / ')} dB quieter than the melody in F♯ / C / F ` +
        `(needs 3 dB or more, with under 3 dB between keys)`);
      const loudest = await gapsAt(1);
      const louder = loudest.map(g => -g);
      report(Math.min(...louder) >= 8 && Math.max(...louder) <= 12, 'Drone at full volume is about 10 dB louder than the melody',
        `drone is ${louder.map(g => g.toFixed(1)).join(' / ')} dB louder than the melody in F♯ / C / F (needs 8–12 dB)`);
    }

    // 5. Volume matching: every sound has about the same average loudness, at the
    // darkest, middle and brightest tone. Same melody for each, dry.
    async function checkVolumeMatch() {
      const lines = [];
      let worstSpread = 0;
      for (const tone of [0, 0.5, 1]) {
        const levels = [];
        for (const w of SOUNDS) {
          const settings = { key: 'C', scale: 'major-pentatonic', sound: w.id, tone, tempo: 60 };
          const buf = await render(20, ctx => {
            const rng = createRandom(9);
            let prev = null;
            for (let t = 0.05; t < 20; t += beatInterval(settings.tempo)) {
              const note = nextNote(prev, settings, rng);
              playNote(ctx, ctx.destination, t, note, settings);
              prev = note.midi;
            }
          });
          levels.push(20 * Math.log10(rms(buf, 4, 18)));
        }
        const spread = Math.max(...levels) - Math.min(...levels);
        worstSpread = Math.max(worstSpread, spread);
        lines.push(`tone ${tone}: ` + SOUNDS.map((w, i) => `${w.id} ${levels[i].toFixed(1)}`).join(', ') + ` dB (spread ${spread.toFixed(1)})`);
      }
      report(worstSpread <= 2, 'Sounds are volume-matched (within 2 dB)', lines.join(' | '));
    }

    // 5b. Even across the range: within each sound, every note of the melody range is
    // about as loud as the others, so no note jumps out or fades away. One 3 s note per
    // semitone, middle tone, whole note measured.
    async function checkEvenness() {
      const lines = [];
      let worst = { range: 0 };
      for (const w of SOUNDS) {
        const levels = [];
        for (let midi = 42; midi <= 77; midi++) {
          const buf = await render(3.1, ctx =>
            playNote(ctx, ctx.destination, 0, { midi, duration: 3 }, { sound: w.id, tone: 0.5, width: 0 }));
          levels.push(20 * Math.log10(rms(buf, 0, 3.1)));
        }
        const range = Math.max(...levels) - Math.min(...levels);
        lines.push(`${w.id} ${range.toFixed(1)}`);
        if (range > worst.range) worst = { range, id: w.id };
      }
      report(worst.range <= 3, 'Every sound is even across the melody range (within 3 dB)',
        `loudest minus quietest note, MIDI 42–77: ${lines.join(', ')} dB`);
    }

    // 6. No pop at a key change: the old drone fades out smoothly while the new one fades
    // in. Covers the cases that used to pop: after moving the volume slider, and a second
    // key change while the new drone is still fading in.
    function biggestJump(buffer, from, to) {
      const d = buffer.getChannelData(0);
      let max = 0;
      for (let i = Math.floor(from * RATE) + 1; i < to * RATE; i++) max = Math.max(max, Math.abs(d[i] - d[i - 1]));
      return max;
    }

    async function checkKeyChange() {
      const cases = [
        { name: 'after slider moves', change: 10, normal: [5, 9.5], build: (ctx, out) => {
          const d = startDrone(ctx, out, 0.05, dronePitch('F'), 0.33);
          d.setVolume(0.8, 3); d.setVolume(1, 9.9);
          d.release(10);
          startDrone(ctx, out, 10, dronePitch('C'), 1);
        } },
        { name: 'mid fade-in', change: 1, normal: [0.6, 0.95], build: (ctx, out) => {
          startDrone(ctx, out, 0.05, dronePitch('F'), 1).release(1);
          startDrone(ctx, out, 1, dronePitch('C'), 1);
        } },
      ];
      const results = [];
      let ok = true;
      for (const c of cases) {
        const buf = await render(c.change + 4, ctx => c.build(ctx, ctx.destination));
        const atChange = biggestJump(buf, c.change - 0.05, c.change + 0.1);
        const normal = biggestJump(buf, ...c.normal);
        ok &&= atChange <= normal * 1.5;
        results.push(`${c.name}: ${atChange.toFixed(4)} at the change vs ${normal.toFixed(4)} normally`);
      }
      report(ok, 'No pop when the drone changes key',
        `biggest sample-to-sample jump — ${results.join('; ')} (limit 1.5x normal)`);
    }

    try {
      await checkKeyChange();
      await checkVolumeMatch();
      await checkEvenness();
      await checkClicks();
      await checkDrone();
      await checkPeak();
      await checkHarmonyLoudness();
      await checkRhythmLoudness();
      await checkStereo();
      await checkDrift();
      await checkStop();
    } catch (err) {
      report(false, 'Checks crashed', String(err));
    }
    const failed = results.filter(ok => !ok).length;
    const status = document.getElementById('status');
    status.textContent = failed ? `${failed} check(s) failed.` : `All ${results.length} checks passed.`;
    status.className = failed ? 'fail' : 'pass';
    document.body.dataset.result = failed ? 'fail' : 'pass';
  </script>
</body>
</html>
